    <!-- Tela de abertura: pinta no 1º quadro, antes do JS, igual à splash do Android (mesmo fundo
         #070a09, símbolo centrado com 115px = 48% do ícone maskable de 240dp). O React a remove
         quando sessão e dados terminam de carregar (src/lib/splash.ts); não há tempo mínimo. -->
    <style>
      #app-splash { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: #070a09; opacity: 1; transition: opacity 180ms ease-out; }
      #app-splash .app-splash-mark { position: relative; width: 115px; height: 93px; animation: app-splash-breathe 1.8s ease-in-out 250ms infinite; }
      #app-splash .app-splash-mark::before { content: ""; position: absolute; inset: -55%; border-radius: 50%; background: radial-gradient(closest-side, rgba(184, 255, 0, .16), rgba(184, 255, 0, 0)); opacity: 0; animation: app-splash-halo 1.8s ease-in-out 250ms infinite; }
      #app-splash img { position: relative; display: block; width: 115px; height: 93px; }
      #app-splash.is-leaving { opacity: 0; }
      #app-splash.is-leaving .app-splash-mark { animation: none; transform: scale(1.06); transition: transform 180ms ease-out; }
      @keyframes app-splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
      @keyframes app-splash-halo { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash, #app-splash.is-leaving .app-splash-mark { transition: none; }
        #app-splash .app-splash-mark, #app-splash .app-splash-mark::before { animation: none; }
      }
    </style>
